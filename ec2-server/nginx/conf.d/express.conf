server {
    listen 443 ssl;
    server_name api.nearzoom.store;

    ssl_certificate     /etc/letsencrypt/live/api.nearzoom.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nearzoom.store/privkey.pem;

    # WebSocket 경로
    location /ws/ {
        proxy_pass http://ws_server:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 기본 경로를 Spring Boot 애플리케이션으로 프록시
    location / {
        proxy_pass http://nearzoom-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name api.nearzoom.store;

    # Let's Encrypt HTTP-01 Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}